const MISSING = "#ff00ff";
function drawSprite(ctx, sprite, x, y, scale = 1, paletteOverride = {}) {
    const palette = { ...sprite.palette, ...paletteOverride };
    const rows = sprite.rows;
    for (let row = 0; row < rows.length; row++) {
        const line = rows[row];
        for (let col = 0; col < line.length; col++) {
            const key = line[col];
            if (key === ".") continue;
            ctx.fillStyle = palette[key] ?? MISSING;
            ctx.fillRect(x + col * scale, y + row * scale, scale, scale);
        }
    }
}
function spriteCanvas(sprite, scale = 1, paletteOverride = {}) {
    const width = Math.max(...sprite.rows.map(line => line.length));
    const canvas = document.createElement("canvas");
    canvas.width = width * scale;
    canvas.height = sprite.rows.length * scale;
    const ctx = canvas.getContext("2d");
    drawSprite(ctx, sprite, 0, 0, scale, paletteOverride);
    return canvas;
}
function cell(parent, canvas, label) {
    const div = document.createElement("div");
    div.className = "cell";
    div.appendChild(canvas);
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = label;
    div.appendChild(name);
    parent.appendChild(div);
}
